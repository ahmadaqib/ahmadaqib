name: 🎨 Generate Profile Animations

on:
  schedule:
    - cron: "17 */12 * * *" # tiap 12 jam (menit 17 supaya tidak antre di jam sibuk :00)
  workflow_dispatch: # jalankan manual dari tab Actions
  push:
    branches: [main]
    paths:
      - ".github/workflows/animate.yml"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: profile-animations
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      USERNAME: ${{ github.repository_owner }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 1) BINARY ASTRONAUT — astronot dari bit username, bintang = hari berkontribusi
      - name: 🧑‍🚀 Generate Binary Astronaut
        run: node scripts/astronaut.mjs dist/astronaut.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NICKNAME: aqib

      # 2) PAC-MAN — Pac-Man memakan kotak kontribusi
      - name: 👾 Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@70945878b1118303b37b88060fc7145e1a57d7b1 # main per 2026-11-11 (v5.3.2 + 7 commit)
        with:
          github_user_name: ${{ env.USERNAME }}

      # Gagal di sini = branch 'output' TIDAK ditimpa, jadi gambar lama tetap tampil
      - name: ✅ Verify outputs
        run: |
          set -e
          for f in dist/astronaut.svg dist/pacman-contribution-graph.svg dist/pacman-contribution-graph-dark.svg; do
            test -s "$f" || { echo "::error::File hilang/kosong: $f"; exit 1; }
          done
          echo "### 🎨 File yang dihasilkan" >> "$GITHUB_STEP_SUMMARY"
          find dist -name '*.svg' | sort | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

      # 3) PUSH SEMUA KE BRANCH 'output'
      - name: 🚀 Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update profile animations"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
