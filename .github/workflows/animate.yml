name: 🎨 Generate Profile Animations

on:
  schedule:
    - cron: "17 */12 * * *" # tiap 12 jam (menit 17 supaya tidak antre di jam sibuk :00)
  workflow_dispatch: # jalankan manual dari tab Actions
  push:
    branches: [main]
    paths: [".github/workflows/animate.yml"]

permissions:
  contents: write

concurrency:
  group: profile-animations
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      USERNAME: ${{ github.repository_owner }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📁 Prepare dist directory
        run: mkdir -p dist

      # 1) SNAKE — 4 varian: light, dark, neon (ungu-pink), ocean (biru-oranye)
      - name: 🐍 Generate Snake animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ env.USERNAME }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/snake-neon.svg?palette=github-dark&color_snake=#ff2bd6&color_dots=#161b22,#3b0a45,#7a1fa2,#c13cff,#f0abfc
            dist/snake-ocean.svg?palette=github-dark&color_snake=#ffa657&color_dots=#161b22,#0b3d5c,#1f6feb,#58a6ff,#a5d6ff

      # 2) PAC-MAN — Pac-Man memakan kotak kontribusi
      - name: 👾 Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main # sebaiknya pin ke commit SHA
        with:
          github_user_name: ${{ env.USERNAME }}

      # 3) 3D CONTRIBUTION — beberapa tema (green, season, night-rainbow, dll.)
      - name: 🧊 Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ env.USERNAME }}

      - name: 📦 Move 3D assets into dist
        run: mv profile-3d-contrib dist/

      # Gagal di sini = branch 'output' TIDAK ditimpa, jadi gambar lama tetap tampil
      - name: ✅ Verify outputs
        run: |
          set -e
          for f in \
            dist/github-contribution-grid-snake.svg \
            dist/github-contribution-grid-snake-dark.svg \
            dist/snake-neon.svg \
            dist/snake-ocean.svg \
            dist/profile-3d-contrib/profile-night-rainbow.svg; do
            test -s "$f" || { echo "::error::File hilang/kosong: $f"; exit 1; }
          done
          echo "### 🎨 File yang dihasilkan" >> "$GITHUB_STEP_SUMMARY"
          find dist -name '*.svg' | sort | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

      # 4) PUSH SEMUA KE BRANCH 'output'
      - name: 🚀 Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update profile animations"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
